[package]
name = "ingot-core"
description = "BinSifter Ingot - scan engine (hashing, NSRL, blocklist, CSV reporting). No HTTP or UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
csv = "1.3"
walkdir = "2"
memmap2 = "0.9"
bytemuck = "1"
rayon = "1"
directories = "5"
goblin = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
yara-x = "1"
fuzzyhash = "0.2"
wait-timeout = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile = "3"
pe-sign = "0.1"
rustls-native-certs = "0.8"
base64 = "0.22"

# archive expansion (all pure-Rust so static cross builds stay possible)
zip = { version = "8", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
sevenz-rust2 = "0.22"
lzma-rs = "0.3"
bzip2-rs = "0.1"
