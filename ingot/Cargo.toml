[workspace]
resolver = "2"
members = ["crates/ingot-core", "crates/ingot-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV floor is set by yara-x + its bundled wasmtime/cranelift, which chase a
# recent toolchain; bump this as those deps do (CI's `msrv` job pins it).
rust-version = "1.93"
license = "LicenseRef-PolyForm-Strict-1.0.0"
repository = "https://github.com/churtacheese-create/BinSifter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
