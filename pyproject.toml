[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binsifter"
version = "2.0.0"
description = "Winnow - BinSifter's Python/PySide6 variant, a forensic binary triage tool for bulk assessment"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "BinSifter Project" }]

# Pinned to library-based integrations wherever the PowerShell version had to
# shell out to an external .exe - see project memory "BinSifter post-prototype
# roadmap" for why this matters (no per-file process-spawn overhead, no
# fragile stdout/JSON parsing, no "is the exe on PATH" configuration surface
# for these five tools specifically).
dependencies = [
    # Not used directly by BinSifter's own code - pinned here as a real
    # RUNTIME dependency (not just the [build-system] requires above) so its
    # distutils compatibility shim (_distutils_hack) is always installed
    # alongside speakeasy-emulator's hard "unicorn==1.0.2" pin (see that
    # entry below). Without setuptools present, unicorn 1.0.2's Python
    # bindings do a bare "import distutils.sysconfig" that raises
    # ModuleNotFoundError on Python 3.12+, where distutils was removed from
    # the standard library outright - confirmed the hard way on a real
    # Python 3.13 install (2026-07-30). Harmless/no-op on Python <3.12,
    # where distutils still exists natively.
    # Upper bound is load-bearing, not cosmetic: unicorn 1.0.2's Python
    # bindings ALSO do a bare "import pkg_resources" right after the
    # distutils import (same file, next line) - setuptools removed
    # pkg_resources outright in 82.0.0 (confirmed the hard way too, right
    # after fixing the distutils half of this on 2026-07-30: installing
    # plain "setuptools" pulled 83.0.0 and traded one ModuleNotFoundError
    # for another). <82 keeps both the distutils shim and pkg_resources
    # available in the same install.
    "setuptools>=68,<82",
    "PySide6>=6.7",       # LGPL - safe for closed-source distribution, unlike PyQt6 (GPL/paid-commercial)
    "yara-python>=4.5",   # YARA engine, imported directly instead of shelling out to yara64.exe
    "flare-capa>=9.0",    # Mandiant capa, as a library instead of capa.exe
    "flare-floss>=3.0",   # Mandiant FLOSS, as a library instead of floss.exe
    "speakeasy-emulator>=1.5",  # Mandiant Speakeasy, as a library instead of hunting for a nonexistent speakeasy.exe.
                                 # NOTE: pinned to the 1.5.x stable line, not 2.0 - as of 2026-07-30 PyPI only has
                                 # pre-release 2.0.0b betas, which pip won't select for a plain ">=2.0" constraint
                                 # (confirmed the hard way - an earlier ">=2.0" here broke the whole install, since
                                 # pip fails the entire dependency resolution as one unit on an unsatisfiable pin,
                                 # not just that one package). Revisit once 2.0 has an actual stable release.
                                 # NOTE 2: speakeasy-emulator 1.5.11 itself hard-pins "unicorn==1.0.2" (an exact
                                 # equality, not a floor) - confirmed via `importlib.metadata.requires()`, not
                                 # assumed. That old unicorn release does a bare "import distutils.sysconfig" at
                                 # module load (removed from unicorn's own loader entirely as of the 2.x line, per
                                 # its GitHub source) - harmless on Python <3.12 where distutils still exists, but
                                 # a hard ModuleNotFoundError on 3.12+. Can't fix by re-pinning unicorn here (pip
                                 # would just report an unresolvable conflict against speakeasy's own pin) - the
                                 # "setuptools" entry above is the actual fix, restoring distutils via setuptools'
                                 # own compatibility shim instead.
    "ppdeep>=20200505",   # Pure-Python ssdeep-compatible fuzzy hashing - no C library/compiler dependency,
                           # which matters a lot for the Linux + installer goals (the real "ssdeep" PyPI
                           # package requires libfuzzy to be compiled/available on the target machine).
    "pefile>=2023.2.7",   # PE parsing (imphash, Rich header) - pure Python, no external tool needed at all.
    "signify[msi]>=0.8",   # Authenticode/PKCS#7 verification, pure Python and cross-platform -
                           # replaces the PowerShell version's Windows-only Get-AuthenticodeSignature.
                           # Already validates against a real, populated Microsoft trust store by
                           # default (see core/authenticode.py's module docstring, 2026-08-06
                           # correction) - "Valid" is the expected result for a genuinely signed
                           # file with an intact chain, not "NotTrusted". The [msi] extra pulls in
                           # olefile, without which signify can't even attempt to parse .msi
                           # installers at all (AuthenticodeFile.from_stream() raises ParseError
                           # before ever reaching a real signed/unsigned verdict) - found 2026-08-06
                           # via a real scan where 75 .msi files all landed in "UnknownError" for
                           # exactly this reason.
    "numpy>=1.24",         # Added 2026-08-04 for core/nsrl.py's cached binary NSRL index - a
                           # one-time C-level sort of tens of millions of 20-byte SHA-1 digests
                           # (np.sort on a 'V20' dtype view) plus np.memmap for shared, per-process
                           # lookups without duplicating a multi-GB structure into every worker.
                           # Prebuilt wheels exist for Windows/Linux/macOS/ARM64, so this doesn't
                           # reintroduce the "needs a compiler on the target machine" problem the
                           # ppdeep/pure-Python choices elsewhere in this file were made to avoid.
    "py7zr>=1.1",          # Added 2026-08-07 for core/archive.py's 7z support - one of the 4
                           # archive formats confirmed (zip/tar/gzip are all Python
                           # stdlib via zipfile/tarfile/gzip, no dependency needed for those 3;
                           # 7z has no stdlib equivalent at all). Prebuilt wheels exist for
                           # Windows/Linux/macOS, same "no compiler needed on the target machine"
                           # bar as every other dependency in this file. RAR was explicitly NOT
                           # added - needs an external unrar/unar binary (same footprint as
                           # Sigcheck/Ghidra's exe-discovery model, not a pip-installable library),
                           # deferred until there's a confirmed real need for it.
    "pyzipper>=0.3",       # Added 2026-08-08: found via a real scan against Malware Bazaar zips
                           # (which use WinZip AE-x/AES-256 encryption, not legacy ZipCrypto) that
                           # Python's stdlib `zipfile` cannot decrypt AES-encrypted entries at all -
                           # it can list/open the archive fine (central-directory reads don't need
                           # the key) but raises NotImplementedError("That compression method is
                           # not supported") the instant it tries to actually decompress an AE-x
                           # entry (compress_type 99, which stdlib zipfile's _check_compression()
                           # doesn't recognize), regardless of whether the supplied password is
                           # correct. `pyzipper.AESZipFile` is a drop-in superset of
                           # `zipfile.ZipFile` (same extract()/infolist()/setpassword() API) that
                           # adds real AE-1/AE-2 AES decryption - core/archive.py's _extract_zip()
                           # now uses it instead. Confirmed this diagnosis both by reading stdlib
                           # zipfile's source directly and by reproducing the exact error message
                           # against a synthetic AES-encrypted zip before applying the fix, not
                           # just assumed. Rowan needed no equivalent change - it shells out to
                           # 7z.exe for all archive formats, and 7-Zip has native AES-zip support
                           # built in (confirmed by an earlier Rowan test against the same
                           # kind of Malware Bazaar zips, which extracted successfully).
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
binsifter = "binsifter.gui.__main__:main"
binsifter-scan = "binsifter.cli:main"

[tool.setuptools.packages.find]
include = ["binsifter*"]
